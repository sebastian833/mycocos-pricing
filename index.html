<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor de Pricing — MyCOCOS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0f11;font-family:'DM Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700&display=swap');
  .login-card{background:#16181c;border:1px solid #2a2d34;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;display:flex;flex-direction:column;gap:1.5rem}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:18px;color:#f0f0ee}
  .logo-dot{width:10px;height:10px;background:#c8f060;border-radius:50%}
  .subtitle{font-size:12px;color:#7a7f8a;margin-top:4px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;color:#7a7f8a;letter-spacing:.05em}
  .field input{background:#1e2126;border:1px solid #2a2d34;border-radius:8px;padding:12px 14px;color:#f0f0ee;font-family:'DM Mono',monospace;font-size:14px;outline:none;transition:border-color .15s}
  .field input:focus{border-color:#60d4f0}
  .field input::placeholder{color:#4a4f5a}
  .btn-login{background:#c8f060;color:#0e0f11;border:none;border-radius:8px;padding:12px;font-family:'DM Mono',monospace;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;width:100%}
  .btn-login:hover{background:#d4f470}
  .error{background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:#f06060;display:none}
  .hint{font-size:11px;color:#4a4f5a;text-align:center}
</style>
</head>
<body>
<div class="login-card">
  <div>
    <div class="logo"><div class="logo-dot"></div>MyCOCOS · Pricing</div>
    <div class="subtitle">Motor de pricing dinámico — acceso interno</div>
  </div>
  <div class="field">
    <label>CONTRASEÑA DE ACCESO</label>
    <input type="password" id="pwd" placeholder="Ingresá la contraseña..." onkeydown="if(event.key==='Enter')unlock()">
  </div>
  <div class="error" id="err">Contraseña incorrecta. Intentá de nuevo.</div>
  <button class="btn-login" onclick="unlock()">Ingresar →</button>
  <div class="hint">Uso exclusivo equipo MyCOCOS · Todos los cálculos corren en el navegador</div>
</div>

<!-- APP CONTENT HIDDEN — decrypted on correct password -->
<div id="app" style="display:none;position:fixed;inset:0;z-index:999;overflow:auto"></div>

<script>
// SHA-256 of the password is stored here — never the plain text password
// To change the password: update PASS_HASH with the SHA-256 of your new password
// SHA-256 of "mycocos2025" = a5f3c... (update this with your own hash below)
const PASS_HASH = "888869df34302fd19661547e7f7836c1fcddfd36662af4ccca97ab62cd8b727a";

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function unlock() {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  const hash = await sha256(pwd);
  if (hash === PASS_HASH) {
    // Store session (tab-level only, not persistent)
    sessionStorage.setItem('mc_auth', hash);
    loadApp();
  } else {
    const err = document.getElementById('err');
    err.style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
    setTimeout(()=>err.style.display='none', 3000);
  }
}

async function checkSession() {
  const stored = sessionStorage.getItem('mc_auth');
  if (stored && stored === PASS_HASH) loadApp();
}

function loadApp() {
  document.body.style.background = 'transparent';
  document.querySelector('.login-card').parentElement.style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'block';
  // Load the pricing app in an iframe pointing to pricing.html
  app.innerHTML = '<iframe src="pricing.html" style="width:100%;height:100%;border:none;position:fixed;inset:0" allowfullscreen></iframe>';
}

checkSession();
</script>
</body>
</html>
